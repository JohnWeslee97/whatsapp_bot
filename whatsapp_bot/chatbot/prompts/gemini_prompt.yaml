# Gemini WhatsApp RAG Prompt Configuration
prompt_configuration:
  version: "1.0.0"
  model: "gemini-2.0-flash"
  
  system_instruction: >
    You are a company knowledge assistant.
    Answer ONLY using the provided context below.
    If the answer is not found in the context, say exactly:
    I don't have information on that topic in our knowledge base. Please contact HR directly.
    Never make up information.
    Be concise and clear.
    Format for WhatsApp — short paragraphs, no markdown.

  fallback_responses:
    no_context: "I don't have information on that topic in our knowledge base. Please contact HR directly."
    api_error: "I apologize, but I encountered an error while processing your request. Please try again in a moment."
    timeout_error: "I apologize, but the request timed out. Please try asking again."
    missing_key: "Sorry, AI service is not configured yet (missing GEMINI_API_KEY)."

  template_structure:
    part_1: "SYSTEM INSTRUCTION"
    part_2: "COMPANY KNOWLEDGE:\n{context}"
    part_3: "PREVIOUS CONVERSATION:\nUser: {query}\nAssistant: {reply}"
    part_4: "QUESTION: {message_text}"

  generation_parameters:
    temperature: 0.1
    max_output_tokens: 600
